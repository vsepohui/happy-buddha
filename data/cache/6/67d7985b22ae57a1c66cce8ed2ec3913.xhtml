
<h1 class="sectionedit1" id="Метрополитен">Метрополитен</h1>
<div class="level1">

<p>
Метрополитен - это <a href="/%D0%A7%D1%83%D0%B4%D0%B5%D1%81%D0%B0/%D0%A2%D0%B5%D0%BC%D0%BF%D0%BB" class="wikilink1" title="Чудеса:Темпл" data-wiki-id="Чудеса:Темпл">Темпл</a>, заложен в городе Москва. 
</p>

<p>
Он выстроен целиком по идеям Льва Троцкого.
</p>

<p>
Темплу, чтобы быть завершенный, нужно только переименование: из «Московский Метрополитен им. Ленина» в «Московский Метрополитен им. Льва Троцкого»! 
</p>

</div>
