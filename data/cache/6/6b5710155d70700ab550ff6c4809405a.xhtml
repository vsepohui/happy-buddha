
<h1 class="sectionedit1" id="Оникс">Оникс</h1>
<div class="level1">

<p>
Оникс - это открытие Джона Леннона, которое тот совершил в 7 лет. 
</p>

<p>
Оникс - это полы в домах, по которым долго ходил Господь Бог. 
</p>

<p>
Оникс используется как основа для сверхпроводников в ЭВМ для спая в печатных платах.
</p>
