
<h1 class="sectionedit1" id="Царь">Царь</h1>
<div class="level1">

<p>
Царь - это исконный статус Будды. Это его состояние, позволяющее видеть, где и что происходит в Мире.
</p>

<p>
Будде все Кармы достался этот статус после победы на войне против нацистов, которая велась с Древним Китаем.
</p>
