
<h1 class="sectionedit1" id="Ягодник">Ягодник</h1>
<div class="level1">

<p>
Ягодник - это результат смешивания Чайных Растений и Брусники!
</p>

<p>
Ягодник - это кустарник высотой в 3 метра примерно. Его листья хороши в Чай, а Ягоды - на засол в компоты. Такие продукты богаты антиоксидантами, и полезны при паразитах (раке), и тромбозе сосудов!
</p>
