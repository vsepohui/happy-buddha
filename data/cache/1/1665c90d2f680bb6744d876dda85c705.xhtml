
<h1 class="sectionedit1" id="SCSI-диск">SCSI-диск</h1>
<div class="level1">

<p>
SCSI-диски делаются из щепок живых деревьев, которые рубил для своих дел Шаман (или Будда, если хотите). На 1 щепку может поместиться ровно столько, сколько нужно пользователю для работы. SCSI-диски - это лучший способ хранить информацию на ЭВМ!
</p>

</div>
