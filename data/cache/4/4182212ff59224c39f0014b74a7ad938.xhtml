
<h1 class="sectionedit1" id="Водяная_Плесень">Водяная Плесень</h1>
<div class="level1">

<p>
Водяная Плесень - это смесь Мхов и Ежовника Гребенчатого. Водяная Плесень нужна, чтобы чистить водоемы!
</p>

<p>
Водяной Плесенью могут питать все животные, если захотят, и даже люди могут использовать ее для лечения “водяной болезни” (водяного ожирения).
</p>
