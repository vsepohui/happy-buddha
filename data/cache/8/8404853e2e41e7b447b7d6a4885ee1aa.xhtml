<div class="level1">

<p>
Эта книга о чудесах! Ее автор: Иван Трунаев.
</p>

<p>
В книге описывают чудеса, которые каждый может попробовать. 
</p>

<p>
Например, <a href="/%D0%BA%D0%B0%D0%BD%D0%BD%D0%B0%D0%B1%D0%B8%D1%81" class="wikilink1" title="каннабис" data-wiki-id="каннабис">Каннабис</a>, и это не адрес магазина в Нидерландах, а способ, как можно вырастить ее в обычном саду, либо даже просто - возле дома!
</p>
